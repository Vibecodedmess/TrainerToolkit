# XcodeGen spec. CI runs `xcodegen generate` to create TrainerToolkit.xcodeproj.
# The generated .xcodeproj is not committed (see .gitignore).
# Bundle ID, display name and version live in Config/Shared.xcconfig.
name: TrainerToolkit

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"

packages:
  TrainerKit:
    path: Packages/TrainerKit

targets:
  TrainerToolkit:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Shared
      - path: Persistence
      - path: Resources # app icon asset catalog (scripts/make-app-icon.ps1)
        optional: true
    dependencies:
      - package: TrainerKit
        product: GameMath # level tables + CP / cost math
      - package: TrainerKit
        product: DataSources
      - package: TrainerKit
        product: SearchBuilder
      - package: TrainerKit
        product: CollectionImport
      - package: TrainerKit
        product: Counters
      - package: TrainerKit
        product: ScreenshotImport
      - package: TrainerKit
        product: BackupFormat
      # Home Screen widget (Phase 23), embedded in the app's PlugIns folder.
      - target: TrainerToolkitWidget
    settings:
      base:
        PRODUCT_NAME: TrainerToolkit
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: $(APP_VERSION)
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
        # The app-wide tint: Resources/Assets.xcassets/AccentColor.colorset (light and dark).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Home Screen widget: Community Day countdown and current raid bosses. It downloads the public
  # event and raid feeds itself (no App Group: a free Apple ID can't provide one through Sideloadly),
  # so it can't read the app's own data.
  TrainerToolkitWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - package: TrainerKit
        product: DataSources
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: TrainerToolkitWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        MARKETING_VERSION: $(APP_VERSION)
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  TrainerToolkit:
    build:
      targets:
        TrainerToolkit: all
