name: Build unsigned IPA

# Runs only when you ask for it (Actions tab > Run workflow) or when you push a v* tag,
# to keep macOS runner minutes low. Add `push: branches: [main]` if you want every push built.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed only to attach the IPA to a Release on v* tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build:
    # Build machine only; the IPA is identical either way. If jobs sit "Queued" and fail with
    # "not acquired by Runner", that pool is out of capacity: switch between macos-15 (Apple silicon)
    # and macos-15-intel. In use since 2026-11-11 (arm64 was out of capacity then).
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Unit tests (TrainerKit package)
        run: |
          set -o pipefail
          swift test --package-path Packages/TrainerKit 2>&1 | tee test.log

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project TrainerToolkit.xcodeproj \
            -scheme TrainerToolkit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log

      # Lists compiler warnings on the run's summary page (the full logs are long and load slowly).
      - name: Warnings summary
        if: always()
        run: |
          : > warnings.txt
          for f in test.log build.log; do
            [ -f "$f" ] && grep -E ': warning: ' "$f" | sed -E "s#^$GITHUB_WORKSPACE/##" >> warnings.txt || true
          done
          sort -u warnings.txt -o warnings.txt
          n=$(wc -l < warnings.txt | tr -d ' ')
          {
            echo "### Compiler warnings: $n"
            if [ "$n" -gt 0 ]; then
              echo '```'
              head -n 150 warnings.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/TrainerToolkit.app
          test -d "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry TrainerToolkit.ipa Payload
          ls -lh TrainerToolkit.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: TrainerToolkit-ipa-${{ github.run_number }}
          path: dist/TrainerToolkit.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Attach IPA to GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TrainerToolkit.ipa \
            --title "$GITHUB_REF_NAME" --generate-notes
